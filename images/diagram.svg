<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 850" width="1400" height="850">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="850" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="700" y="45" text-anchor="middle" font-size="32" font-weight="bold" font-family="sans-serif" fill="#1a1a2e">火眼金睛读财报</text>
  <text x="700" y="72" text-anchor="middle" font-size="18" font-family="sans-serif" fill="#666">张新民财报分析框架</text>

  <!-- Core: 核心理念 -->
  <rect x="350" y="105" width="700" height="55" rx="10" fill="#d0bfff" stroke="#845ef7" stroke-width="2" filter="url(#shadow)"/>
  <text x="700" y="139" text-anchor="middle" font-size="20" font-weight="bold" font-family="sans-serif" fill="#1a1a2e">核心理念：经营视角看财报 · 三表联动看经营</text>

  <!-- Arrows from core to three statements -->
  <line x1="700" y1="160" x2="235" y2="198" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="160" x2="700" y2="198" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="160" x2="1165" y2="198" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- === Row: Three Statements === -->
  <!-- 利润表 -->
  <rect x="60" y="200" width="350" height="46" rx="8" fill="#a5d8ff" stroke="#4c6ef5" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="229" text-anchor="middle" font-size="19" font-weight="bold" font-family="sans-serif" fill="#1a1a2e">利 润 表</text>

  <rect x="60" y="258" width="350" height="120" rx="6" fill="#e7f5ff" stroke="#4c6ef5" stroke-width="1.5"/>
  <text x="235" y="282" text-anchor="middle" font-size="15" font-family="sans-serif" fill="#1864ab">营收确认方式 · 收入真实性</text>
  <text x="235" y="305" text-anchor="middle" font-size="15" font-family="sans-serif" fill="#1864ab">毛利率 = (收入-成本)/收入</text>
  <text x="235" y="328" text-anchor="middle" font-size="15" font-family="sans-serif" fill="#1864ab">营业利润率趋势</text>
  <text x="235" y="351" text-anchor="middle" font-size="15" font-family="sans-serif" fill="#1864ab">三项费用分析（销售/管理/研发）</text>

  <!-- 资产负债表 -->
  <rect x="525" y="200" width="350" height="46" rx="8" fill="#c3fae8" stroke="#12b886" stroke-width="2" filter="url(#shadow)"/>
  <text x="700" y="229" text-anchor="middle" font-size="19" font-weight="bold" font-family="sans-serif" fill="#1a1a2e">资产负债表</text>

  <rect x="525" y="258" width="350" height="120" rx="6" fill="#e6fcf5" stroke="#12b886" stroke-width="1.5"/>
  <text x="700" y="282" text-anchor="middle" font-size="15" font-family="sans-serif" fill="#087f5b">资产结构（轻资产 vs 重资产）</text>
  <text x="700" y="305" text-anchor="middle" font-size="15" font-family="sans-serif" fill="#087f5b">应收/应付/存货联动分析</text>
  <text x="700" y="328" text-anchor="middle" font-size="15" font-family="sans-serif" fill="#087f5b">货币资金 vs 有息负债</text>
  <text x="700" y="351" text-anchor="middle" font-size="15" font-family="sans-serif" fill="#087f5b">资产负债率 · 周转率</text>

  <!-- 现金流量表 -->
  <rect x="990" y="200" width="350" height="46" rx="8" fill="#b2f2bb" stroke="#40c057" stroke-width="2" filter="url(#shadow)"/>
  <text x="1165" y="229" text-anchor="middle" font-size="19" font-weight="bold" font-family="sans-serif" fill="#1a1a2e">现金流量表</text>

  <rect x="990" y="258" width="350" height="120" rx="6" fill="#ebfbee" stroke="#40c057" stroke-width="1.5"/>
  <text x="1165" y="282" text-anchor="middle" font-size="15" font-family="sans-serif" fill="#2b8a3e">经营活动现金流（造血核心）</text>
  <text x="1165" y="305" text-anchor="middle" font-size="15" font-family="sans-serif" fill="#2b8a3e">净现比 = 经营现金流/净利润</text>
  <text x="1165" y="328" text-anchor="middle" font-size="15" font-family="sans-serif" fill="#2b8a3e">自由现金流 = 经营 - 资本支出</text>
  <text x="1165" y="351" text-anchor="middle" font-size="15" font-family="sans-serif" fill="#2b8a3e">投资/筹资活动方向</text>

  <!-- Arrows from details down -->
  <line x1="235" y1="378" x2="235" y2="440" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="378" x2="700" y2="440" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1165" y1="378" x2="1165" y2="440" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- === Section: 五大违法信号 === -->
  <rect x="60" y="445" width="1280" height="90" rx="10" fill="#ffc9c9" fill-opacity="0.25" stroke="#f03e3e" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="700" y="470" text-anchor="middle" font-size="18" font-weight="bold" font-family="sans-serif" fill="#e03131">五大违法信号（造假识别）</text>

  <!-- Red flag boxes -->
  <rect x="75" y="482" width="225" height="44" rx="6" fill="#ffc9c9" stroke="#e03131" stroke-width="1.5"/>
  <text x="187" y="502" text-anchor="middle" font-size="14" font-weight="bold" font-family="sans-serif" fill="#c92a2a">① 收入造假</text>
  <text x="187" y="518" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#c92a2a">提前确认 / 虚构收入</text>

  <rect x="320" y="482" width="225" height="44" rx="6" fill="#ffd8a8" stroke="#e8590c" stroke-width="1.5"/>
  <text x="432" y="502" text-anchor="middle" font-size="14" font-weight="bold" font-family="sans-serif" fill="#c92a2a">② 毛利反常</text>
  <text x="432" y="518" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#c92a2a">远超行业均值</text>

  <rect x="565" y="482" width="225" height="44" rx="6" fill="#ffc9c9" stroke="#e03131" stroke-width="1.5"/>
  <text x="677" y="502" text-anchor="middle" font-size="14" font-weight="bold" font-family="sans-serif" fill="#c92a2a">③ 存贷双高</text>
  <text x="677" y="518" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#c92a2a">大存大贷异象</text>

  <rect x="810" y="482" width="225" height="44" rx="6" fill="#ffd8a8" stroke="#e8590c" stroke-width="1.5"/>
  <text x="922" y="502" text-anchor="middle" font-size="14" font-weight="bold" font-family="sans-serif" fill="#c92a2a">④ 应收暴增</text>
  <text x="922" y="518" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#c92a2a">收入无现金回流</text>

  <rect x="1055" y="482" width="225" height="44" rx="6" fill="#ffc9c9" stroke="#e03131" stroke-width="1.5"/>
  <text x="1167" y="502" text-anchor="middle" font-size="14" font-weight="bold" font-family="sans-serif" fill="#c92a2a">⑤ 净现比&lt;1</text>
  <text x="1167" y="518" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#c92a2a">利润无实钱支撑</text>

  <!-- === Section: 30分钟读财报工作流 === -->
  <rect x="60" y="565" width="1280" height="75" rx="10" fill="#fff3bf" fill-opacity="0.3" stroke="#f08c00" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="700" y="588" text-anchor="middle" font-size="18" font-weight="bold" font-family="sans-serif" fill="#e67700">30分钟读财报工作流</text>

  <!-- Flow steps -->
  <rect x="75" y="598" width="215" height="34" rx="6" fill="#a5d8ff" stroke="#4c6ef5" stroke-width="1.5"/>
  <text x="182" y="620" text-anchor="middle" font-size="13" font-weight="bold" font-family="sans-serif" fill="#1864ab">看毛利率 → 判护城河</text>

  <rect x="320" y="598" width="215" height="34" rx="6" fill="#a5d8ff" stroke="#4c6ef5" stroke-width="1.5"/>
  <text x="427" y="620" text-anchor="middle" font-size="13" font-weight="bold" font-family="sans-serif" fill="#1864ab">看经营现金流 → 验利润</text>

  <rect x="565" y="598" width="215" height="34" rx="6" fill="#a5d8ff" stroke="#4c6ef5" stroke-width="1.5"/>
  <text x="672" y="620" text-anchor="middle" font-size="13" font-weight="bold" font-family="sans-serif" fill="#1864ab">看应收/存货 → 查竞争</text>

  <rect x="810" y="598" width="215" height="34" rx="6" fill="#a5d8ff" stroke="#4c6ef5" stroke-width="1.5"/>
  <text x="917" y="620" text-anchor="middle" font-size="13" font-weight="bold" font-family="sans-serif" fill="#1864ab">看负债结构 → 测偿债</text>

  <rect x="1055" y="598" width="215" height="34" rx="6" fill="#a5d8ff" stroke="#4c6ef5" stroke-width="1.5"/>
  <text x="1162" y="620" text-anchor="middle" font-size="13" font-weight="bold" font-family="sans-serif" fill="#1864ab">三表联动 → 综合定论</text>

  <!-- Flow arrows -->
  <line x1="292" y1="615" x2="314" y2="615" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="537" y1="615" x2="559" y2="615" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="782" y1="615" x2="804" y2="615" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1027" y1="615" x2="1049" y2="615" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bottom tip -->
  <rect x="300" y="670" width="800" height="46" rx="10" fill="#d0bfff" stroke="#845ef7" stroke-width="2" filter="url(#shadow)"/>
  <text x="700" y="698" text-anchor="middle" font-size="17" font-weight="bold" font-family="sans-serif" fill="#6741d9">核心框架：利润 = 资产 x 周转率 x 净利率 | 三表不是孤立的，联起来才是真相</text>

</svg>