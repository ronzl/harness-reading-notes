<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850" font-family="sans-serif">
  <defs>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-down" markerWidth="8" markerHeight="6" refX="8" refY="3" markerUnits="userSpaceOnUse" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#868e96"/>
    </marker>
    <marker id="arrow-right" markerWidth="8" markerHeight="6" refX="8" refY="3" markerUnits="userSpaceOnUse" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#adb5bd"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="850" fill="#f8f9fa" rx="8"/>

  <!-- Title Bar -->
  <rect x="0" y="0" width="1200" height="50" fill="#6741d9" rx="8"/>
  <rect x="0" y="25" width="1200" height="25" fill="#6741d9"/>
  <text x="600" y="32" text-anchor="middle" fill="#fff" font-size="20" font-weight="bold">一个农民的亿万传奇 -- 知识全景图</text>

  <!-- ═══ 第一层：信仰层 ═══ -->
  <rect x="30" y="66" width="1140" height="175" rx="10" fill="#f3f0ff" stroke="#d0bfff" stroke-width="1.5" filter="url(#shadow)"/>

  <rect x="30" y="66" width="150" height="30" rx="6" fill="#6741d9"/>
  <text x="105" y="86" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">信仰层: 天道</text>

  <text x="50" y="118" fill="#495057" font-size="13">
    <tspan x="50" dy="0" font-weight="bold" fill="#6741d9" font-size="14">核心信仰: </tspan>
    <tspan dy="0">价格由供需决定，这是自然规律(天道)，不是庄家也不是K线可以改变的</tspan>
  </text>

  <!-- Three axioms -->
  <rect x="50" y="138" width="330" height="44" rx="6" fill="#fff" stroke="#d0bfff" stroke-width="1"/>
  <text x="215" y="155" text-anchor="middle" fill="#6741d9" font-size="12" font-weight="bold">公理一: 万物皆有周期</text>
  <text x="215" y="172" text-anchor="middle" fill="#868e96" font-size="10">盛极而衰，否极泰来，经验不可逆</text>

  <rect x="410" y="138" width="340" height="44" rx="6" fill="#fff" stroke="#d0bfff" stroke-width="1"/>
  <text x="580" y="155" text-anchor="middle" fill="#6741d9" font-size="12" font-weight="bold">公理二: 价格不能长期偏离成本</text>
  <text x="580" y="172" text-anchor="middle" fill="#868e96" font-size="10">低于成本=减产=回升; 暴利=扩产=回落</text>

  <rect x="780" y="138" width="360" height="44" rx="6" fill="#fff" stroke="#d0bfff" stroke-width="1"/>
  <text x="960" y="155" text-anchor="middle" fill="#6741d9" font-size="12" font-weight="bold">公理三: 人性不变</text>
  <text x="960" y="172" text-anchor="middle" fill="#868e96" font-size="10">追涨杀跌是本能，极端时刻共识总是错的</text>

  <!-- Core formula -->
  <rect x="250" y="196" width="700" height="34" rx="17" fill="#6741d9" opacity="0.06" stroke="#6741d9" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="600" y="218" text-anchor="middle" fill="#6741d9" font-size="13" font-weight="bold">核心公式: 成本 -&gt; 供给收缩 -&gt; 价格底部 -&gt; 供需反转 -&gt; 趋势爆发</text>

  <!-- Arrow -->
  <line x1="600" y1="241" x2="600" y2="258" stroke="#868e96" stroke-width="2" marker-end="url(#arrow-down)"/>

  <!-- ═══ 第二层：方法层 ═══ -->
  <rect x="30" y="263" width="1140" height="270" rx="10" fill="#e7f5ff" stroke="#a5d8ff" stroke-width="1.5" filter="url(#shadow)"/>

  <rect x="30" y="263" width="160" height="30" rx="6" fill="#1864ab"/>
  <text x="110" y="283" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">方法层: 原则+操作</text>

  <!-- Left: Four Principles -->
  <rect x="50" y="305" width="510" height="215" rx="6" fill="#fff" opacity="0.9" stroke="#a5d8ff" stroke-width="1"/>
  <text x="305" y="327" text-anchor="middle" fill="#1864ab" font-size="14" font-weight="bold">核心四原则</text>

  <!-- P1 -->
  <rect x="60" y="340" width="235" height="62" rx="6" fill="#e7f5ff"/>
  <text x="177" y="360" text-anchor="middle" fill="#1864ab" font-size="12" font-weight="bold">1. 物极必反</text>
  <text x="177" y="378" text-anchor="middle" fill="#495057" font-size="10">价格/情绪/供需 三个极端</text>
  <text x="177" y="394" text-anchor="middle" fill="#868e96" font-size="10">跌多必涨，涨多必跌</text>

  <!-- P2 -->
  <rect x="310" y="340" width="235" height="62" rx="6" fill="#e7f5ff"/>
  <text x="427" y="360" text-anchor="middle" fill="#1864ab" font-size="12" font-weight="bold">2. 成本决定底部</text>
  <text x="427" y="378" text-anchor="middle" fill="#495057" font-size="10">低于成本=不可持续</text>
  <text x="427" y="394" text-anchor="middle" fill="#868e96" font-size="10">算全行业成本，不是龙头成本</text>

  <!-- P3 -->
  <rect x="60" y="412" width="235" height="62" rx="6" fill="#e7f5ff"/>
  <text x="177" y="432" text-anchor="middle" fill="#1864ab" font-size="12" font-weight="bold">3. 供需决定一切</text>
  <text x="177" y="450" text-anchor="middle" fill="#495057" font-size="10">不看K线，看种多少收多少</text>
  <text x="177" y="466" text-anchor="middle" fill="#868e96" font-size="10">需求必须是不可逆的刚需</text>

  <!-- P4 -->
  <rect x="310" y="412" width="235" height="62" rx="6" fill="#e7f5ff"/>
  <text x="427" y="432" text-anchor="middle" fill="#1864ab" font-size="12" font-weight="bold">4. 极端情绪是反指</text>
  <text x="427" y="450" text-anchor="middle" fill="#495057" font-size="10">一致看空=买; 一致看多=卖</text>
  <text x="427" y="466" text-anchor="middle" fill="#868e96" font-size="10">"这次不一样"=最危险的信号</text>

  <!-- Right: Six Steps -->
  <line x1="570" y1="410" x2="595" y2="410" stroke="#adb5bd" stroke-width="2"/>

  <rect x="600" y="305" width="550" height="215" rx="6" fill="#fff" opacity="0.9" stroke="#a5d8ff" stroke-width="1"/>
  <text x="875" y="327" text-anchor="middle" fill="#1864ab" font-size="14" font-weight="bold">六步操作系统</text>

  <!-- Row 1: Steps 1-4 -->
  <rect x="615" y="340" width="110" height="36" rx="6" fill="#fff3bf" stroke="#fab005" stroke-width="1.5"/>
  <text x="670" y="363" text-anchor="middle" fill="#e67700" font-size="11" font-weight="bold">1. 选品</text>

  <line x1="725" y1="358" x2="740" y2="358" stroke="#adb5bd" stroke-width="1.5" marker-end="url(#arrow-right)"/>

  <rect x="745" y="340" width="110" height="36" rx="6" fill="#fff3bf" stroke="#fab005" stroke-width="1.5"/>
  <text x="800" y="363" text-anchor="middle" fill="#e67700" font-size="11" font-weight="bold">2. 调研</text>

  <line x1="855" y1="358" x2="870" y2="358" stroke="#adb5bd" stroke-width="1.5" marker-end="url(#arrow-right)"/>

  <rect x="875" y="340" width="110" height="36" rx="6" fill="#ffc9c9" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="930" y="363" text-anchor="middle" fill="#c92a2a" font-size="11" font-weight="bold">3. 等待</text>

  <line x1="985" y1="358" x2="1000" y2="358" stroke="#adb5bd" stroke-width="1.5" marker-end="url(#arrow-right)"/>

  <rect x="1005" y="340" width="110" height="36" rx="6" fill="#b2f2bb" stroke="#51cf66" stroke-width="1.5"/>
  <text x="1060" y="363" text-anchor="middle" fill="#2b8a3e" font-size="11" font-weight="bold">4. 建仓</text>

  <!-- Row 2: Steps 5-6 + key battles -->
  <line x1="670" y1="376" x2="670" y2="400" stroke="#adb5bd" stroke-width="1.5" marker-end="url(#arrow-down)"/>

  <rect x="615" y="405" width="110" height="36" rx="6" fill="#d0bfff" stroke="#845ef7" stroke-width="1.5"/>
  <text x="670" y="428" text-anchor="middle" fill="#6741d9" font-size="11" font-weight="bold">5. 持仓</text>

  <line x1="725" y1="423" x2="740" y2="423" stroke="#adb5bd" stroke-width="1.5" marker-end="url(#arrow-right)"/>

  <rect x="745" y="405" width="110" height="36" rx="6" fill="#ffc9c9" stroke="#ff6b6b" stroke-width="1.5"/>
  <text x="800" y="428" text-anchor="middle" fill="#c92a2a" font-size="11" font-weight="bold">6. 平仓</text>

  <rect x="955" y="405" width="120" height="36" rx="6" fill="#fff" stroke="#adb5bd" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="1015" y="422" text-anchor="middle" fill="#868e96" font-size="10">经典战役</text>
  <text x="1015" y="436" text-anchor="middle" fill="#adb5bd" font-size="9">棉花/大蒜/PVC</text>

  <!-- Arrow -->
  <line x1="600" y1="533" x2="600" y2="548" stroke="#868e96" stroke-width="2" marker-end="url(#arrow-down)"/>

  <!-- ═══ 第三层：工具层 ═══ -->
  <rect x="30" y="553" width="1140" height="275" rx="10" fill="#ebfbee" stroke="#b2f2bb" stroke-width="1.5" filter="url(#shadow)"/>

  <rect x="30" y="553" width="160" height="30" rx="6" fill="#2b8a3e"/>
  <text x="110" y="573" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">工具层: 判断+风控</text>

  <!-- Tool 1: Scorecard -->
  <rect x="50" y="596" width="350" height="215" rx="6" fill="#fff" stroke="#b2f2bb" stroke-width="1.5"/>
  <text x="225" y="618" text-anchor="middle" fill="#2b8a3e" font-size="13" font-weight="bold">极端信号评分卡(12分制)</text>
  <line x1="60" y1="626" x2="390" y2="626" stroke="#e9ecef" stroke-width="1"/>

  <text x="60" y="645" fill="#495057" font-size="11">价格信号  低于成本20%+(2分) 低于成本(1分)</text>
  <text x="60" y="665" fill="#495057" font-size="11">利润信号  全行业亏(2分)  部分亏(1分)  盈利(0分)</text>
  <text x="60" y="685" fill="#495057" font-size="11">供应信号  已减产(2分)  有意向(1分)  扩产(0分)</text>
  <text x="60" y="705" fill="#495057" font-size="11">库存信号  极端位置(2分)  中性(1分)  高位(0分)</text>
  <text x="60" y="725" fill="#495057" font-size="11">情绪信号  一致悲观(2分)  分歧(1分)  一致乐观(0分)</text>
  <text x="60" y="745" fill="#495057" font-size="11">资金信号  爆仓(2分)  平衡(1分)  杠杆涌入(0分)</text>

  <rect x="60" y="760" width="330" height="24" rx="12" fill="#d3f9d8" stroke="#51cf66" stroke-width="1"/>
  <text x="225" y="777" text-anchor="middle" fill="#2b8a3e" font-size="11" font-weight="bold">总分 >= 8 = 行动 | 5-7 = 关注 | &lt;= 4 = 放弃</text>

  <!-- Tool 2: Cost Anchor -->
  <rect x="425" y="596" width="345" height="215" rx="6" fill="#fff" stroke="#b2f2bb" stroke-width="1.5"/>
  <text x="597" y="618" text-anchor="middle" fill="#2b8a3e" font-size="13" font-weight="bold">成本锚定速查</text>
  <line x1="435" y1="626" x2="760" y2="626" stroke="#e9ecef" stroke-width="1"/>

  <rect x="440" y="640" width="145" height="24" rx="4" fill="#e7f5ff"/>
  <text x="512" y="657" text-anchor="middle" fill="#1864ab" font-size="11" font-weight="bold">农产品</text>
  <text x="595" y="657" fill="#495057" font-size="11">-&gt; 种植成本(种子+化肥+人工+地租)</text>

  <rect x="440" y="672" width="145" height="24" rx="4" fill="#e7f5ff"/>
  <text x="512" y="689" text-anchor="middle" fill="#1864ab" font-size="11" font-weight="bold">工业品</text>
  <text x="595" y="689" fill="#495057" font-size="11">-&gt; 全行业平均生产成本</text>

  <rect x="440" y="704" width="145" height="24" rx="4" fill="#e7f5ff"/>
  <text x="512" y="721" text-anchor="middle" fill="#1864ab" font-size="11" font-weight="bold">金融周期股</text>
  <text x="595" y="721" fill="#495057" font-size="11">-&gt; 内含价值(Embedded Value)/PB</text>

  <text x="440" y="755" fill="#c92a2a" font-size="11" font-weight="bold">常见错误: 用龙头成本代全行业/忽略固定成本分摊/把补贴算进成本</text>

  <rect x="440" y="770" width="315" height="24" rx="12" fill="#ffc9c9" stroke="#ff6b6b" stroke-width="1"/>
  <text x="597" y="787" text-anchor="middle" fill="#c92a2a" font-size="11" font-weight="bold">核心纪律: 低于成本不设止损，高于成本严格止损</text>

  <!-- Tool 3: Red Lines -->
  <rect x="795" y="596" width="355" height="215" rx="6" fill="#fff" stroke="#ffc9c9" stroke-width="1.5"/>
  <text x="972" y="618" text-anchor="middle" fill="#c92a2a" font-size="13" font-weight="bold">风险红线</text>
  <line x1="805" y1="626" x2="1140" y2="626" stroke="#e9ecef" stroke-width="1"/>

  <rect x="810" y="640" width="325" height="26" rx="4" fill="#fff5f5" stroke="#ffc9c9" stroke-width="1"/>
  <text x="972" y="658" text-anchor="middle" fill="#c92a2a" font-size="11">需求可能永久消失的品种(诺基亚陷阱)</text>

  <rect x="810" y="674" width="325" height="26" rx="4" fill="#fff5f5" stroke="#ffc9c9" stroke-width="1"/>
  <text x="972" y="692" text-anchor="middle" fill="#c92a2a" font-size="11">成本算不清的纯概念股</text>

  <rect x="810" y="708" width="325" height="26" rx="4" fill="#fff5f5" stroke="#ffc9c9" stroke-width="1"/>
  <text x="972" y="726" text-anchor="middle" fill="#c92a2a" font-size="11">政策干预频繁的品种(国储/限价/关税)</text>

  <rect x="810" y="742" width="325" height="26" rx="4" fill="#fff5f5" stroke="#ffc9c9" stroke-width="1"/>
  <text x="972" y="760" text-anchor="middle" fill="#c92a2a" font-size="11">杠杆过高，借钱交易</text>

  <rect x="810" y="780" width="325" height="22" rx="6" fill="#fff3bf"/>
  <text x="972" y="795" text-anchor="middle" fill="#e67700" font-size="9">持仓心法: 不看账户浮亏看基本面 | 忍受20-30%回撤 | 关掉交易群</text>

</svg>
