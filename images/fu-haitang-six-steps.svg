<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="1400" height="950" font-family="sans-serif">
  <defs>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1400" height="950" fill="#f8f9fa" rx="8"/>

  <!-- Title Bar -->
  <rect x="0" y="0" width="1400" height="52" fill="#1864ab" rx="8"/>
  <rect x="0" y="28" width="1400" height="24" fill="#1864ab"/>
  <text x="700" y="34" text-anchor="middle" fill="#fff" font-size="20" font-weight="bold">傅海棠六步操作系统流程图</text>

  <!-- ═══ Step Boxes (Row 1: Step number + name) ═══ -->
  
  <!-- Step 1: 选品 -->
  <rect x="40" y="80" width="190" height="60" rx="8" fill="#fff3bf" stroke="#fab005" stroke-width="2" filter="url(#shadow)"/>
  <text x="135" y="104" text-anchor="middle" fill="#e67700" font-size="14" font-weight="bold">Step 1</text>
  <text x="135" y="126" text-anchor="middle" fill="#e67700" font-size="16" font-weight="bold">选品</text>

  <!-- Arrow 1-2 (thick line, no marker) -->
  <line x1="240" y1="110" x2="275" y2="110" stroke="#868e96" stroke-width="3"/>

  <!-- Step 2: 调研 -->
  <rect x="285" y="80" width="190" height="60" rx="8" fill="#fff3bf" stroke="#fab005" stroke-width="2" filter="url(#shadow)"/>
  <text x="380" y="104" text-anchor="middle" fill="#e67700" font-size="14" font-weight="bold">Step 2</text>
  <text x="380" y="126" text-anchor="middle" fill="#e67700" font-size="16" font-weight="bold">实地调研</text>

  <line x1="485" y1="110" x2="520" y2="110" stroke="#868e96" stroke-width="3"/>

  <!-- Step 3: 等待 -->
  <rect x="530" y="80" width="190" height="60" rx="8" fill="#ffc9c9" stroke="#ff6b6b" stroke-width="2" filter="url(#shadow)"/>
  <text x="625" y="104" text-anchor="middle" fill="#c92a2a" font-size="14" font-weight="bold">Step 3</text>
  <text x="625" y="126" text-anchor="middle" fill="#c92a2a" font-size="16" font-weight="bold">等待极端信号</text>

  <line x1="730" y1="110" x2="765" y2="110" stroke="#868e96" stroke-width="3"/>

  <!-- Step 4: 建仓 -->
  <rect x="775" y="80" width="190" height="60" rx="8" fill="#b2f2bb" stroke="#51cf66" stroke-width="2" filter="url(#shadow)"/>
  <text x="870" y="104" text-anchor="middle" fill="#2b8a3e" font-size="14" font-weight="bold">Step 4</text>
  <text x="870" y="126" text-anchor="middle" fill="#2b8a3e" font-size="16" font-weight="bold">建仓</text>

  <line x1="975" y1="110" x2="1010" y2="110" stroke="#868e96" stroke-width="3"/>

  <!-- Step 5: 持仓 -->
  <rect x="1020" y="80" width="190" height="60" rx="8" fill="#d0bfff" stroke="#845ef7" stroke-width="2" filter="url(#shadow)"/>
  <text x="1115" y="104" text-anchor="middle" fill="#6741d9" font-size="14" font-weight="bold">Step 5</text>
  <text x="1115" y="126" text-anchor="middle" fill="#6741d9" font-size="16" font-weight="bold">持仓</text>

  <line x1="1220" y1="110" x2="1245" y2="110" stroke="#868e96" stroke-width="3"/>

  <!-- Step 6: 平仓 -->
  <rect x="1255" y="80" width="110" height="60" rx="8" fill="#ffc9c9" stroke="#ff6b6b" stroke-width="2" filter="url(#shadow)"/>
  <text x="1310" y="104" text-anchor="middle" fill="#c92a2a" font-size="14" font-weight="bold">Step 6</text>
  <text x="1310" y="126" text-anchor="middle" fill="#c92a2a" font-size="16" font-weight="bold">平仓</text>

  <!-- ═══ Vertical connectors to detail boxes ═══ -->
  <line x1="135" y1="140" x2="135" y2="175" stroke="#adb5bd" stroke-width="2.5"/>
  <line x1="380" y1="140" x2="380" y2="175" stroke="#adb5bd" stroke-width="2.5"/>
  <line x1="625" y1="140" x2="625" y2="175" stroke="#adb5bd" stroke-width="2.5"/>
  <line x1="870" y1="140" x2="870" y2="175" stroke="#adb5bd" stroke-width="2.5"/>
  <line x1="1115" y1="140" x2="1115" y2="175" stroke="#adb5bd" stroke-width="2.5"/>
  <line x1="1310" y1="140" x2="1310" y2="175" stroke="#adb5bd" stroke-width="2.5"/>

  <!-- ═══ Detail Boxes (Row 2: Sub-steps) ═══ -->

  <!-- Step 1 Details -->
  <rect x="25" y="180" width="220" height="180" rx="6" fill="#fff" stroke="#fab005" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="25" y="180" width="220" height="28" rx="6" fill="#fff3bf"/>
  <rect x="25" y="200" width="220" height="8" fill="#fff3bf"/>
  <text x="135" y="199" text-anchor="middle" fill="#e67700" font-size="12" font-weight="bold">选品标准</text>

  <text x="38" y="228" fill="#495057" font-size="11">必须是强周期品种</text>
  <text x="38" y="248" fill="#495057" font-size="11">必须有明确的生产成本锚</text>
  <text x="38" y="268" fill="#495057" font-size="11">必须经历足够长的下跌周期</text>
  <text x="38" y="288" fill="#495057" font-size="11">不可做短期调整品种</text>
  <text x="38" y="308" fill="#495057" font-size="11">需求必须不可逆(刚需)</text>

  <line x1="38" y1="318" x2="232" y2="318" stroke="#e9ecef" stroke-width="1"/>
  <text x="38" y="336" fill="#c92a2a" font-size="10">注：排除需求可能消失的品种</text>
  <text x="38" y="352" fill="#c92a2a" font-size="10">排除成本算不清的品种</text>

  <!-- Step 2 Details -->
  <rect x="270" y="180" width="220" height="180" rx="6" fill="#fff" stroke="#fab005" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="270" y="180" width="220" height="28" rx="6" fill="#fff3bf"/>
  <rect x="270" y="200" width="220" height="8" fill="#fff3bf"/>
  <text x="380" y="199" text-anchor="middle" fill="#e67700" font-size="12" font-weight="bold">调研确认清单</text>

  <text x="283" y="228" fill="#495057" font-size="11">亲自去产区/厂区看</text>
  <text x="283" y="248" fill="#495057" font-size="11">不做纯数据推演</text>
  <text x="283" y="268" fill="#495057" font-size="11">确认全行业平均成本</text>
  <text x="283" y="288" fill="#495057" font-size="11">不是龙头成本</text>
  <text x="283" y="308" fill="#495057" font-size="11">确认减产已真实发生</text>

  <line x1="283" y1="318" x2="477" y2="318" stroke="#e9ecef" stroke-width="1"/>
  <text x="283" y="336" fill="#c92a2a" font-size="10">关键：不是"可能减产"</text>
  <text x="283" y="352" fill="#c92a2a" font-size="10">而是"已经减产"</text>

  <!-- Step 3 Details -->
  <rect x="515" y="180" width="220" height="340" rx="6" fill="#fff" stroke="#ff6b6b" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="515" y="180" width="220" height="28" rx="6" fill="#ffc9c9"/>
  <rect x="515" y="200" width="220" height="8" fill="#ffc9c9"/>
  <text x="625" y="199" text-anchor="middle" fill="#c92a2a" font-size="12" font-weight="bold">极端信号（6选4）</text>

  <rect x="528" y="220" width="195" height="28" rx="4" fill="#fff5f5"/>
  <text x="534" y="238" fill="#c92a2a" font-size="11" font-weight="bold">价格极端</text>
  <text x="534" y="255" fill="#868e96" font-size="10">低于全行业成本20%+</text>

  <rect x="528" y="256" width="195" height="28" rx="4" fill="#fff5f5"/>
  <text x="534" y="274" fill="#c92a2a" font-size="11" font-weight="bold">利润极端</text>
  <text x="534" y="291" fill="#868e96" font-size="10">全行业大面积亏损</text>

  <rect x="528" y="292" width="195" height="28" rx="4" fill="#fff5f5"/>
  <text x="534" y="310" fill="#c92a2a" font-size="11" font-weight="bold">供应极端</text>
  <text x="534" y="327" fill="#868e96" font-size="10">减产停产新闻频出</text>

  <rect x="528" y="328" width="195" height="28" rx="4" fill="#fff5f5"/>
  <text x="534" y="346" fill="#c92a2a" font-size="11" font-weight="bold">库存极端</text>
  <text x="534" y="363" fill="#868e96" font-size="10">库销比处于历史极端位置</text>

  <rect x="528" y="364" width="195" height="28" rx="4" fill="#fff5f5"/>
  <text x="534" y="382" fill="#c92a2a" font-size="11" font-weight="bold">情绪极端</text>
  <text x="534" y="399" fill="#868e96" font-size="10">全市场一致看空无人问津</text>

  <rect x="528" y="400" width="195" height="28" rx="4" fill="#fff5f5"/>
  <text x="534" y="418" fill="#c92a2a" font-size="11" font-weight="bold">资金极端</text>
  <text x="534" y="435" fill="#868e96" font-size="10">融资盘大幅爆仓</text>

  <rect x="528" y="446" width="195" height="24" rx="12" fill="#ffc9c9" stroke="#ff6b6b" stroke-width="1"/>
  <text x="625" y="463" text-anchor="middle" fill="#c92a2a" font-size="11" font-weight="bold">至少 4/6 集齐才行动</text>

  <rect x="528" y="482" width="195" height="28" rx="4" fill="#fff3bf"/>
  <text x="625" y="500" text-anchor="middle" fill="#e67700" font-size="11">缺失的信号继续等待</text>

  <!-- Step 4 Details -->
  <rect x="760" y="180" width="220" height="180" rx="6" fill="#fff" stroke="#51cf66" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="760" y="180" width="220" height="28" rx="6" fill="#b2f2bb"/>
  <rect x="760" y="200" width="220" height="8" fill="#b2f2bb"/>
  <text x="870" y="199" text-anchor="middle" fill="#2b8a3e" font-size="12" font-weight="bold">建仓纪律</text>

  <text x="773" y="228" fill="#495057" font-size="11">第一批试仓 30%</text>
  <text x="773" y="248" fill="#495057" font-size="11">信号确认后加至 60-70%</text>
  <text x="773" y="268" fill="#495057" font-size="11">倒金字塔加仓</text>
  <text x="773" y="288" fill="#495057" font-size="11">越跌越买</text>
  <text x="773" y="308" fill="#495057" font-size="11">低于成本不设止损</text>

  <line x1="773" y1="318" x2="967" y2="318" stroke="#e9ecef" stroke-width="1"/>
  <text x="773" y="336" fill="#c92a2a" font-size="10" font-weight="bold">核心纪律（前提：成本算对）</text>
  <text x="773" y="352" fill="#868e96" font-size="10">低于成本=安全区，不止损</text>

  <!-- Step 5 Details -->
  <rect x="1005" y="180" width="220" height="180" rx="6" fill="#fff" stroke="#845ef7" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="1005" y="180" width="220" height="28" rx="6" fill="#d0bfff"/>
  <rect x="1005" y="200" width="220" height="8" fill="#d0bfff"/>
  <text x="1115" y="199" text-anchor="middle" fill="#6741d9" font-size="12" font-weight="bold">持仓心法</text>

  <text x="1018" y="228" fill="#495057" font-size="11">不看账户浮亏浮盈</text>
  <text x="1018" y="248" fill="#495057" font-size="11">看基本面数据</text>
  <text x="1018" y="268" fill="#495057" font-size="11">忍受 20-30% 正常回撤</text>
  <text x="1018" y="288" fill="#495057" font-size="11">基本面没变就死扛</text>
  <text x="1018" y="308" fill="#495057" font-size="11">像农民种地一样耐心</text>

  <line x1="1018" y1="318" x2="1212" y2="318" stroke="#e9ecef" stroke-width="1"/>
  <text x="1018" y="336" fill="#6741d9" font-size="10" font-weight="bold">噪音过滤清单：</text>
  <text x="1018" y="352" fill="#868e96" font-size="10">关掉交易群 / 雪球 / 朋友圈</text>

  <!-- Step 6 Details -->
  <rect x="1240" y="180" width="135" height="180" rx="6" fill="#fff" stroke="#ff6b6b" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="1240" y="180" width="135" height="28" rx="6" fill="#ffc9c9"/>
  <rect x="1240" y="200" width="135" height="8" fill="#ffc9c9"/>
  <text x="1307" y="199" text-anchor="middle" fill="#c92a2a" font-size="12" font-weight="bold">出场信号</text>

  <text x="1253" y="228" fill="#495057" font-size="11">基本面反转</text>
  <text x="1253" y="248" fill="#495057" font-size="11">暴利出现</text>
  <text x="1253" y="268" fill="#495057" font-size="11">扩产新闻</text>
  <text x="1253" y="288" fill="#495057" font-size="11">新玩家涌入</text>
  <text x="1253" y="308" fill="#495057" font-size="11">全民看多</text>

  <line x1="1253" y1="318" x2="1362" y2="318" stroke="#e9ecef" stroke-width="1"/>
  <text x="1253" y="336" fill="#c92a2a" font-size="10">不吃鱼尾</text>
  <text x="1253" y="352" fill="#c92a2a" font-size="10">不贪最后一波</text>

  <!-- ═══ Bottom section: Summary bar ═══ -->
  <rect x="40" y="550" width="1320" height="50" rx="10" fill="#e7f5ff" stroke="#a5d8ff" stroke-width="1.5"/>
  <text x="700" y="574" text-anchor="middle" fill="#1864ab" font-size="15" font-weight="bold">傅式投资铁律：选标的一算成本一等极端一重仓入一死扛一反转走</text>
  <text x="700" y="592" text-anchor="middle" fill="#868e96" font-size="12">全过程的基础：精准的成本锚 | 绝对的耐心 | 极端信号评分卡的纪律执行</text>

  <!-- ═══ 仓位管理表格 ═══ -->

  <text x="40" y="640" fill="#1864ab" font-size="16" font-weight="bold">仓位管理速查</text>

  <!-- Table header -->
  <rect x="40" y="655" width="150" height="30" rx="0" fill="#1864ab"/>
  <text x="115" y="675" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">条件</text>

  <rect x="190" y="655" width="200" height="30" rx="0" fill="#1864ab"/>
  <text x="290" y="675" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">仓位</text>

  <rect x="390" y="655" width="650" height="30" rx="0" fill="#1864ab"/>
  <text x="715" y="675" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">说明</text>

  <rect x="1040" y="655" width="320" height="30" rx="0" fill="#1864ab"/>
  <text x="1200" y="675" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">备注</text>

  <!-- Table rows -->
  <rect x="40" y="685" width="150" height="32" fill="#e7f5ff" stroke="#dee2e6" stroke-width="0.5"/>
  <text x="115" y="706" text-anchor="middle" fill="#1864ab" font-size="12">信号未集齐</text>
  <rect x="190" y="685" width="200" height="32" fill="#fff" stroke="#dee2e6" stroke-width="0.5"/>
  <text x="290" y="706" text-anchor="middle" fill="#c92a2a" font-size="13" font-weight="bold">0%</text>
  <rect x="390" y="685" width="650" height="32" fill="#fff" stroke="#dee2e6" stroke-width="0.5"/>
  <text x="715" y="706" text-anchor="middle" fill="#495057" font-size="12">不做，耐心等待，没有信号就不动</text>
  <rect x="1040" y="685" width="320" height="32" fill="#fff" stroke="#dee2e6" stroke-width="0.5"/>
  <text x="1200" y="706" text-anchor="middle" fill="#868e96" font-size="11">最难做到的纪律</text>

  <rect x="40" y="717" width="150" height="32" fill="#e7f5ff" stroke="#dee2e6" stroke-width="0.5"/>
  <text x="115" y="738" text-anchor="middle" fill="#1864ab" font-size="12">信号集齐建仓</text>
  <rect x="190" y="717" width="200" height="32" fill="#fff" stroke="#dee2e6" stroke-width="0.5"/>
  <text x="290" y="738" text-anchor="middle" fill="#2b8a3e" font-size="13" font-weight="bold">30%</text>
  <rect x="390" y="717" width="650" height="32" fill="#fff" stroke="#dee2e6" stroke-width="0.5"/>
  <text x="715" y="738" text-anchor="middle" fill="#495057" font-size="12">第一批试仓，轻仓验证判断</text>
  <rect x="1040" y="717" width="320" height="32" fill="#fff" stroke="#dee2e6" stroke-width="0.5"/>
  <text x="1200" y="738" text-anchor="middle" fill="#868e96" font-size="11">亏损也不心疼的仓位</text>

  <rect x="40" y="749" width="150" height="32" fill="#e7f5ff" stroke="#dee2e6" stroke-width="0.5"/>
  <text x="115" y="770" text-anchor="middle" fill="#1864ab" font-size="12">信号确认加仓</text>
  <rect x="190" y="749" width="200" height="32" fill="#fff" stroke="#dee2e6" stroke-width="0.5"/>
  <text x="290" y="770" text-anchor="middle" fill="#2b8a3e" font-size="13" font-weight="bold">50-60%</text>
  <rect x="390" y="749" width="650" height="32" fill="#fff" stroke="#dee2e6" stroke-width="0.5"/>
  <text x="715" y="770" text-anchor="middle" fill="#495057" font-size="12">加仓但不满仓，留有余地</text>
  <rect x="1040" y="749" width="320" height="32" fill="#fff" stroke="#dee2e6" stroke-width="0.5"/>
  <text x="1200" y="770" text-anchor="middle" fill="#868e96" font-size="11">倒金字塔，越跌越买</text>

  <rect x="40" y="781" width="150" height="32" fill="#e7f5ff" stroke="#dee2e6" stroke-width="0.5"/>
  <text x="115" y="802" text-anchor="middle" fill="#1864ab" font-size="12">主升浪重仓</text>
  <rect x="190" y="781" width="200" height="32" fill="#fff" stroke="#dee2e6" stroke-width="0.5"/>
  <text x="290" y="802" text-anchor="middle" fill="#2b8a3e" font-size="13" font-weight="bold">60-70%</text>
  <rect x="390" y="781" width="650" height="32" fill="#fff" stroke="#dee2e6" stroke-width="0.5"/>
  <text x="715" y="802" text-anchor="middle" fill="#495057" font-size="12">重仓参与主升浪，让利润奔跑</text>
  <rect x="1040" y="781" width="320" height="32" fill="#fff" stroke="#dee2e6" stroke-width="0.5"/>
  <text x="1200" y="802" text-anchor="middle" fill="#868e96" font-size="11">傅式风格最佳仓位</text>

  <rect x="40" y="813" width="150" height="32" fill="#e7f5ff" stroke="#dee2e6" stroke-width="0.5"/>
  <text x="115" y="834" text-anchor="middle" fill="#1864ab" font-size="12">逐步减仓</text>
  <rect x="190" y="813" width="200" height="32" fill="#fff" stroke="#dee2e6" stroke-width="0.5"/>
  <text x="290" y="834" text-anchor="middle" fill="#c92a2a" font-size="13" font-weight="bold">-0%</text>
  <rect x="390" y="813" width="650" height="32" fill="#fff" stroke="#dee2e6" stroke-width="0.5"/>
  <text x="715" y="834" text-anchor="middle" fill="#495057" font-size="12">浮盈巨大+信号兑现，逐步清仓</text>
  <rect x="1040" y="813" width="320" height="32" fill="#fff" stroke="#dee2e6" stroke-width="0.5"/>
  <text x="1200" y="834" text-anchor="middle" fill="#c92a2a" font-size="11">不贪最后一波</text>

  <!-- ═══ Bottom warning ═══ -->
  <rect x="40" y="865" width="1320" height="40" rx="8" fill="#fff5f5" stroke="#ffc9c9" stroke-width="1.5"/>
  <text x="700" y="886" text-anchor="middle" fill="#c92a2a" font-size="13" font-weight="bold">绝对不做的底线：需求可能永久消失的品种 | 成本无法算清的品种 | 政策干预不可预测的品种 | 杠杆过高借钱交易</text>
  <text x="700" y="901" text-anchor="middle" fill="#868e96" font-size="10">本质：这个框架的前提假设是"周期还在"，如果需求永久消失了，周期就死了，框架就失效了</text>
</svg>
